name: Publish Android Preview

on:
  workflow_dispatch:
    inputs:
      android_run_id:
        description: "Successful Android workflow run ID from the current main commit"
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  publish:
    if: github.repository == 'shimat/opencvsharp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    environment: nuget-production
    steps:
      - name: Verify Android run and package
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_RUN_ID: ${{ inputs.android_run_id }}
        run: |
          set -euo pipefail
          [[ "$ANDROID_RUN_ID" =~ ^[0-9]+$ ]]
          read -r workflow branch sha conclusion < <(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ANDROID_RUN_ID" \
              --jq '[.name, .head_branch, .head_sha, .conclusion] | @tsv')
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          [[ "$workflow" == Android && "$branch" == main && "$sha" == "$main_sha" && "$conclusion" == success ]]
          gh run download "$ANDROID_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name android-nuget-packages --dir artifacts
          mapfile -t packages < <(find artifacts -maxdepth 1 -type f -name '*.nupkg')
          [[ "${#packages[@]}" -eq 1 ]]
          package="${packages[0]}"
          [[ "$(basename "$package")" =~ ^OpenCvSharp5\.runtime\.android\.[0-9]+\.[0-9]+\.[0-9]+\.[0-9]{8}-beta[0-9]*\.nupkg$ ]]
          echo "PACKAGE=$package" >> "$GITHUB_ENV"
          echo "Publishing only $package"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Push Android beta to nuget.org
        env:
          NUGET_ORG_API_KEY: ${{ secrets.NUGET_ORG_API_KEY }}
        run: |
          set -euo pipefail
          : "${NUGET_ORG_API_KEY:?}"
          dotnet nuget push "$PACKAGE" --force-english-output \
            -k "$NUGET_ORG_API_KEY" -s https://api.nuget.org/v3/index.json
