name: Android

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, codex/android-runtime-2103]
  workflow_dispatch:

env:
  ANDROID_NDK_VERSION: 27.3.13750724
  ANDROID_API_LEVEL: 24

jobs:
  native:
    name: Native (${{ matrix.abi }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        abi: [x86_64, arm64-v8a]
        include:
          - abi: x86_64
            machine: Advanced Micro Devices X86-64
          - abi: arm64-v8a
            machine: AArch64
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Build OpenCV and OpenCvSharpExtern
        shell: bash
        run: |
          set -euo pipefail
          ndk="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          test -f "$ndk/build/cmake/android.toolchain.cmake"
          opencv_install="$RUNNER_TEMP/opencv-install-${{ matrix.abi }}"
          cmake -G Ninja -C cmake/opencv_build_options_android.cmake \
            -S opencv -B "$RUNNER_TEMP/opencv-build-${{ matrix.abi }}" \
            -DCMAKE_TOOLCHAIN_FILE="$ndk/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-${ANDROID_API_LEVEL} \
            -DANDROID_STL=c++_static \
            -DCMAKE_INSTALL_PREFIX="$opencv_install"
          cmake --build "$RUNNER_TEMP/opencv-build-${{ matrix.abi }}" --parallel 3
          cmake --install "$RUNNER_TEMP/opencv-build-${{ matrix.abi }}"

          cmake -G Ninja -S src -B "$RUNNER_TEMP/extern-build-${{ matrix.abi }}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ndk/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-${ANDROID_API_LEVEL} \
            -DANDROID_STL=c++_static \
            -DCMAKE_PREFIX_PATH="$opencv_install" \
            -DOPENCVSHARP_MINIMAL=ON \
            -DNO_CONTRIB=ON \
            -DNO_STITCHING=ON \
            -DNO_GEOMETRY=ON \
            -DNO_CALIB=ON \
            -DNO_STEREO=ON \
            -DNO_PTCLOUD=ON \
            -DNO_VIDEO=ON \
            -DNO_FEATURES=ON \
            -DNO_FLANN=ON \
            -DNO_DNN=ON \
            -DNO_ML=ON \
            -DNO_OBJDETECT=ON \
            -DNO_PHOTO=ON \
            -DNO_BARCODE=ON \
            -DNO_HIGHGUI=ON \
            -DNO_VIDEOIO=ON
          cmake --build "$RUNNER_TEMP/extern-build-${{ matrix.abi }}" --parallel 3
          mkdir -p "packaging/nuget/android/${{ matrix.abi }}"
          cp "$RUNNER_TEMP/extern-build-${{ matrix.abi }}/OpenCvSharpExtern/libOpenCvSharpExtern.so" \
            "packaging/nuget/android/${{ matrix.abi }}/"

      - name: Verify Android ELF
        shell: bash
        run: |
          set -euo pipefail
          library="packaging/nuget/android/${{ matrix.abi }}/libOpenCvSharpExtern.so"
          file "$library"
          readelf -h "$library" | grep -F 'Machine:' | grep -F '${{ matrix.machine }}'
          for symbol in core_Mat_sizeof imgproc_GaussianBlur imgcodecs_imencode_vector imgcodecs_imdecode_vector; do
            nm -D --defined-only "$library" | grep -E " ${symbol}$"
          done
          while read -r needed; do
            case "$needed" in
              libc.so|libm.so|libdl.so|liblog.so|libz.so|libandroid.so) ;;
              *) echo "Unexpected Android dependency: $needed" >&2; exit 1 ;;
            esac
          done < <(readelf -d "$library" | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p')
          readelf -d "$library" | grep NEEDED

      - uses: actions/upload-artifact@v7
        with:
          name: android-native-${{ matrix.abi }}
          path: packaging/nuget/android/${{ matrix.abi }}/libOpenCvSharpExtern.so

  package:
    name: Pack Android NuGet
    needs: native
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: android-native-x86_64
          path: packaging/nuget/android/x86_64
      - uses: actions/download-artifact@v8
        with:
          name: android-native-arm64-v8a
          path: packaging/nuget/android/arm64-v8a
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Pack and inspect packages
        shell: bash
        run: |
          set -euo pipefail
          version="5.0.0-android-ci.${GITHUB_RUN_NUMBER}"
          mkdir -p artifacts
          dotnet pack src/OpenCvSharp/OpenCvSharp.csproj -c Release -o artifacts -p:Version="$version"
          dotnet pack packaging/nuget/OpenCvSharp5.runtime.android.csproj -o artifacts -p:Version="$version"
          package="artifacts/OpenCvSharp5.runtime.android.${version}.nupkg"
          unzip -Z1 "$package" | tee "$RUNNER_TEMP/android-package-files.txt"
          for asset in \
            runtimes/android-x64/native/libOpenCvSharpExtern.so \
            runtimes/android-arm64/native/libOpenCvSharpExtern.so; do
            grep -Fx "$asset" "$RUNNER_TEMP/android-package-files.txt"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: android-nuget-packages
          path: artifacts/*.nupkg

  smoke:
    name: Managed emulator (${{ matrix.rid }})
    needs: package
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        rid: [android-x64, android-arm64]
    env:
      ANDROID_TEST_RID: ${{ matrix.rid }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: android-nuget-packages
          path: artifacts
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install .NET Android workload
        run: dotnet workload install android
      - name: Run managed OpenCvSharp smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash test/OpenCvSharp.AndroidSmoke/run-smoke.sh
