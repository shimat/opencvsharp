name: Wasm

permissions:
  contents: read

on:
  pull_request:
    types: [synchronize, opened]
  push:
    branches:
      - main

env:
  DEBIAN_FRONTEND: noninteractive
  OPENCV_VERSION: 5.1.0
  EM_CACHE_FOLDER: 'emsdk-cache'
  # Bump this whenever the OpenCV cmake flags below change, to bust the OpenCV build cache.
  OPENCV_CACHE_VERSION: 3

jobs:
  build:
    name: Build WASM archive (Emscripten ${{ matrix.emscripten }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        emscripten: ['3.1.56', '6.0.2']
    env:
      EM_VERSION: ${{ matrix.emscripten }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - name: Resolve OpenCV revisions
        id: opencv-revisions
        run: |
          echo "opencv=$(git rev-parse HEAD:opencv)" >> "${GITHUB_OUTPUT}"
          echo "opencv_contrib=$(git rev-parse HEAD:opencv_contrib)" >> "${GITHUB_OUTPUT}"

      - name: Install dependencies
        run: |
          current_path=$(pwd)
          sudo apt-get update -y
          sudo apt-get install -y  --no-install-recommends \
            apt-transport-https \
            software-properties-common \
            wget \
            unzip \
            ca-certificates \
            g++ \
            make \
            cmake \
            libtbb-dev \
            libopenblas-dev \
            libgtk-3-dev \
            libavcodec-dev \
            libavformat-dev \
            libswscale-dev \
            libdc1394-dev \
            libxine2-dev \
            libv4l-dev \
            libtheora-dev \
            libvorbis-dev \
            libxvidcore-dev \
            libopencore-amrnb-dev \
            libopencore-amrwb-dev \
            x264 \
            libtesseract-dev

      - name: Restore OpenCV cache
        id: opencv-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ github.workspace }}/opencv_wasm/include
            ${{ github.workspace }}/opencv_wasm/lib
            ${{ github.workspace }}/opencv_wasm/libopencv.o
          key: opencv-${{ steps.opencv-revisions.outputs.opencv }}-${{ steps.opencv-revisions.outputs.opencv_contrib }}-wasm-${{ env.EM_VERSION }}-v${{ env.OPENCV_CACHE_VERSION }}-${{ hashFiles('cmake/opencv-hooks/POST_FINALIZE.cmake') }}

      - name: Setup Emscripten cache
        id: cache-system-libraries
        uses: actions/cache@v6
        with:
          path: ${{env.EM_CACHE_FOLDER}}
          key: ${{env.EM_VERSION}}-${{ runner.os }}
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: ${{env.EM_VERSION}}
          actions-cache-folder: ${{env.EM_CACHE_FOLDER}}

      - name: Build OpenCV
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        run: |
          emcmake cmake \
            -S opencv \
            -B opencv/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENCV_EXTRA_MODULES_PATH=${GITHUB_WORKSPACE}/opencv_contrib/modules \
            -DBUILD_SHARED_LIBS=OFF \
            -DENABLE_CXX11=ON -DBUILD_TESTS=OFF \
            -DBUILD_PERF_TESTS=OFF \
            -DBUILD_DOCS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_JAVA=OFF \
            -DBUILD_opencv_java_bindings_generator=OFF \
            -DBUILD_opencv_python_bindings_generator=OFF \
            -DBUILD_opencv_python_tests=OFF \
            -DBUILD_opencv_ts=OFF \
            -DBUILD_opencv_js=OFF \
            -DBUILD_opencv_js_bindings_generator=OFF \
            -DBUILD_opencv_apps=OFF \
            -DBUILD_opencv_barcode=OFF \
            -DBUILD_opencv_bioinspired=OFF \
            -DBUILD_opencv_ccalib=OFF \
            -DBUILD_opencv_datasets=OFF \
            -DBUILD_opencv_dnn_objdetect=OFF \
            -DBUILD_opencv_dpm=OFF \
            -DBUILD_opencv_fuzzy=OFF \
            -DBUILD_opencv_gapi=OFF \
            -DBUILD_opencv_intensity_transform=OFF \
            -DBUILD_opencv_mcc=OFF \
            -DBUILD_opencv_objc_bindings_generator=OFF \
            -DBUILD_opencv_rapid=OFF \
            -DBUILD_opencv_reg=OFF \
            -DBUILD_opencv_stereo=ON \
            -DBUILD_opencv_structured_light=OFF \
            -DBUILD_opencv_surface_matching=OFF \
            -DBUILD_opencv_wechat_qrcode=ON \
            -DBUILD_opencv_videostab=OFF \
            -DWITH_GSTREAMER=OFF \
            -DWITH_EIGEN=OFF \
            -DWITH_ADE=OFF \
            -DOPENCV_ENABLE_NONFREE=ON \
            -DCMAKE_INSTALL_PREFIX=${GITHUB_WORKSPACE}/opencv_wasm \
            -DCMAKE_C_FLAGS='-s WASM=1' -DCMAKE_CXX_FLAGS='-s WASM=1' \
            -DWITH_ITT=OFF \
            -DWITH_HARFBUZZ=ON \
            -DBUILD_HARFBUZZ=ON \
            -DWITH_UNIFONT=ON \
            -DOPENCV_CMAKE_HOOKS_DIR="${GITHUB_WORKSPACE}/cmake/opencv-hooks" \
            -DWITH_ITALICFONT=ON \
            -DWITH_JPEG=ON \
            -DWITH_TIFF=ON \
            -DWITH_PNG=ON \
            -DWITH_IPP=OFF \
            -DWITH_LAPACK=OFF \
            -DWITH_OPENCL=OFF \
            -DWITH_PTHREADS_PF=OFF \
            -DCV_ENABLE_INTRINSICS=OFF \
            -DBUILD_opencv_dnn=ON
          cmake --build opencv/build --parallel $(nproc)
          cmake --install opencv/build
          em++ -r -o ${GITHUB_WORKSPACE}/opencv_wasm/libopencv.o \
            -Wl,--whole-archive ${GITHUB_WORKSPACE}/opencv_wasm/lib/*.a \
            ${GITHUB_WORKSPACE}/opencv_wasm/lib/opencv5/3rdparty/*.a
          ls

      - name: Save OpenCV cache
        if: steps.opencv-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ github.workspace }}/opencv_wasm/include
            ${{ github.workspace }}/opencv_wasm/lib
            ${{ github.workspace }}/opencv_wasm/libopencv.o
          key: opencv-${{ steps.opencv-revisions.outputs.opencv }}-${{ steps.opencv-revisions.outputs.opencv_contrib }}-wasm-${{ env.EM_VERSION }}-v${{ env.OPENCV_CACHE_VERSION }}-${{ hashFiles('cmake/opencv-hooks/POST_FINALIZE.cmake') }}

      - name: Build OpenCvSharpExtern
        run: |
          emcc --version
          emcmake cmake -S src -B src/build -DCMAKE_BUILD_TYPE=Release \
            -DOpenCV_DIR="$GITHUB_WORKSPACE/opencv_wasm/lib/cmake/opencv5" \
            -DWASM_LIB="$GITHUB_WORKSPACE/opencv_wasm/libopencv.o"
          cmake --build src/build --parallel "$(nproc)"
          cp src/build/OpenCvSharpExtern/libOpenCvSharpExtern.a OpenCvSharpExtern.a

      - uses: actions/upload-artifact@v7
        with:
          name: wasm-native-${{ matrix.emscripten }}
          path: OpenCvSharpExtern.a
          if-no-files-found: error
          retention-days: 3

  pack:
    name: Pack WASM NuGet
    needs: build
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.pack.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v7
        with:
          pattern: wasm-native-*
          path: native-archives

      - uses: actions/setup-dotnet@v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet-wasm
        with:
          dotnet-version: '10.0.x'

      - name: Create NuGet packages
        id: pack
        run: |
          for emscripten in 3.1.56 6.0.2; do
            mkdir -p "runtimes/browser-wasm/$emscripten"
            cp "native-archives/wasm-native-$emscripten/OpenCvSharpExtern.a" "runtimes/browser-wasm/$emscripten/"
          done
          version="${OPENCV_VERSION}.$(date -u +%Y%m%d)-beta"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          dotnet pack packaging/nuget/OpenCvSharp5.runtime.wasm.csproj -c Release -o artifacts_wasm -p:Version="$version"
          dotnet pack src/OpenCvSharp/OpenCvSharp.csproj -c Release -o managed-test-package -p:Version="$version"

      - name: Check NuGet package contents
        env:
          VERSION: ${{ steps.pack.outputs.version }}
        run: |
          runtime="artifacts_wasm/OpenCvSharp5.runtime.wasm.$VERSION.nupkg"
          unzip -l "$runtime"
          for emscripten in 3.1.56 6.0.2; do
            unzip -p "$runtime" "runtimes/browser-wasm/$emscripten/OpenCvSharpExtern.a" | cmp - "runtimes/browser-wasm/$emscripten/OpenCvSharpExtern.a"
          done
          unzip -p "$runtime" build/net8.0/OpenCvSharp5.runtime.wasm.props > /dev/null
          unzip -p "$runtime" build/net11.0/OpenCvSharp5.runtime.wasm.props > /dev/null
          unzip -p "$runtime" lib/net8.0/_._ > /dev/null
          unzip -p "managed-test-package/OpenCvSharp5.$VERSION.nupkg" lib/net8.0/OpenCvSharp.dll > /dev/null

      - uses: actions/upload-artifact@v7
        with:
          name: artifacts_wasm
          path: artifacts_wasm
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: wasm-managed-test-package
          path: managed-test-package/*.nupkg
          if-no-files-found: error
          retention-days: 3

  browser:
    name: Chrome (${{ matrix.framework }})
    needs: pack
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: net8.0
            sdk: '8.0.x'
            emscripten: '3.1.56'
            workload_emscripten: '3.1.34'
          - framework: net10.0
            sdk: '10.0.x'
            emscripten: '3.1.56'
          - framework: net11.0
            sdk: '11.0.x'
            emscripten: '6.0.2'
    env:
      FRAMEWORK: ${{ matrix.framework }}
      EM_VERSION: ${{ matrix.emscripten }}
      WORKLOAD_EM_VERSION: ${{ matrix.workload_emscripten || matrix.emscripten }}
      PACKAGE_VERSION: ${{ needs.pack.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet-wasm
        with:
          dotnet-version: ${{ matrix.sdk }}

      - name: Install the matching WASM workload
        run: |
          dotnet --version
          dotnet workload install wasm-tools
          shopt -s nullglob
          packs=("$DOTNET_ROOT"/packs/Microsoft.NET.Runtime.Emscripten.*.Sdk.*)
          if [[ ${#packs[@]} != 1 || ${packs[0]:-} != */Microsoft.NET.Runtime.Emscripten."$WORKLOAD_EM_VERSION".Sdk.* ]]; then
            echo "::error::Expected Emscripten $WORKLOAD_EM_VERSION for $FRAMEWORK. Found: ${packs[*]}"
            exit 1
          fi
          echo "WASM toolchain: ${packs[0]}"

      - uses: actions/download-artifact@v7
        with:
          name: artifacts_wasm
          path: wasm-test-feed

      - uses: actions/download-artifact@v7
        with:
          name: wasm-managed-test-package
          path: wasm-test-feed

      - name: Restore and publish the NuGet consumer in Release
        shell: bash
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/wasm-nuget-packages
        run: |
          project=test/OpenCvSharp.Tests.Wasm/OpenCvSharp.Tests.Wasm.csproj
          properties=(-p:TargetFramework="$FRAMEWORK" -p:OpenCvSharpPackageVersion="$PACKAGE_VERSION")
          config="$RUNNER_TEMP/wasm.NuGet.Config"
          cat > "$config" <<EOF
          <configuration>
            <packageSources>
              <clear />
              <add key="workflow" value="$GITHUB_WORKSPACE/wasm-test-feed" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
            <packageSourceMapping>
              <packageSource key="workflow">
                <package pattern="OpenCvSharp5" />
                <package pattern="OpenCvSharp5.runtime.wasm" />
              </packageSource>
              <packageSource key="nuget.org"><package pattern="*" /></packageSource>
            </packageSourceMapping>
          </configuration>
          EOF
          dotnet restore "$project" --configfile "$config" "${properties[@]}"
          dotnet msbuild "$project" -getItem:NativeFileReference "${properties[@]}" |
            jq -er --arg path "$NUGET_PACKAGES/opencvsharp5.runtime.wasm/$PACKAGE_VERSION/runtimes/browser-wasm/$EM_VERSION/OpenCvSharpExtern.a" \
              '.Items.NativeFileReference | select(length == 1) | .[0].FullPath | select(. == $path)'
          log="$RUNNER_TEMP/publish.log"
          dotnet publish "$project" --no-restore -c Release -o artifacts_wasm_e2e "${properties[@]}" 2>&1 | tee "$log"
          if [[ "$FRAMEWORK" != net8.0 ]]; then
            grep -E 'OpenCvSharp.Tests.Wasm\.dll -> .*\.bc' "$log"
          fi
          if grep -E 'OpenCvSharp\.dll -> .*\.bc|undefined symbol:' "$log"; then
            exit 1
          fi

      - name: Run the published NuGet consumer in Chrome
        run: |
          test_dir="$RUNNER_TEMP/wasm-e2e"
          npm install --prefix "$test_dir" --no-save --no-package-lock playwright@1.65.1
          cp test/OpenCvSharp.Tests.Wasm/run-e2e.mjs "$test_dir/"
          python3 -m http.server 8080 --bind 127.0.0.1 --directory artifacts_wasm_e2e/wwwroot &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --fail --silent --show-error --retry 10 --retry-connrefused http://127.0.0.1:8080/ -o /dev/null
          node "$test_dir/run-e2e.mjs" http://127.0.0.1:8080
