name: Publish NuGet

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Prepare and smoke-test packages without publishing"
        type: boolean
        default: false
      keep_beta:
        description: "Publish with the -beta suffix kept (pre-release)"
        type: boolean
        default: false
      skip_platforms:
        description: "Comma-separated platforms to skip (linux-arm64, macos, wasm, manylinux)"
        type: string
        default: ""

permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  Prepare:
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      # Every package must come from this release commit. If a producer has not
      # finished successfully, fail instead of publishing an older artifact.
      - name: Download windows artifact
        uses: dawidd6/action-download-artifact@v28
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          workflow: windows.yml
          name: packages_windows
          commit: ${{ github.sha }}

      - name: Download windows arm64 artifact
        uses: dawidd6/action-download-artifact@v28
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          workflow: windows.yml
          name: packages_windows_arm64
          commit: ${{ github.sha }}

      - name: Download ubuntu arm64 artifact
        if: ${{ !contains(inputs.skip_platforms, 'linux-arm64') }}
        uses: dawidd6/action-download-artifact@v28
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          workflow: linux-arm64.yml
          name: artifacts_linux_arm64
          commit: ${{ github.sha }}

      - name: Download macos artifact
        if: ${{ !contains(inputs.skip_platforms, 'macos') }}
        uses: dawidd6/action-download-artifact@v28
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          workflow: macos.yml
          name: nuget-packages-macos
          commit: ${{ github.sha }}

      - name: Download wasm artifact
        if: ${{ !contains(inputs.skip_platforms, 'wasm') }}
        uses: dawidd6/action-download-artifact@v28
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          workflow: wasm.yml
          name: artifacts_wasm
          commit: ${{ github.sha }}

      - name: Download manylinux artifact
        if: ${{ !contains(inputs.skip_platforms, 'manylinux') }}
        uses: dawidd6/action-download-artifact@v28
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          workflow: manylinux.yml
          name: nuget-packages-manylinux
          commit: ${{ github.sha }}

      - name: Validate expected packages exist
        env:
          SKIP_PLATFORMS: ${{ inputs.skip_platforms }}
        run: |
          $requiredPackages = [ordered]@{
              windows = @(
                  'OpenCvSharp5.5.*.nupkg'
                  'OpenCvSharp5.GdipExtensions.*.nupkg'
                  'OpenCvSharp5.WpfExtensions.*.nupkg'
                  'OpenCvSharp5.AvaloniaExtensions.*.nupkg'
                  'OpenCvSharp5.runtime.win.[0-9]*.nupkg'
                  'OpenCvSharp5.runtime.win-arm64.[0-9]*.nupkg'
                  'OpenCvSharp5.runtime.win-arm64.slim.*.nupkg'
                  'OpenCvSharp5.runtime.win.slim.*.nupkg'
                  'OpenCvSharp5.Windows.[0-9]*.nupkg'
                  'OpenCvSharp5.Windows.Slim.*.nupkg'
              )
              'linux-arm64' = @(
                  'OpenCvSharp5.runtime.linux-arm.*.nupkg'
                  'OpenCvSharp5.runtime.linux-arm64.*.nupkg'
              )
              wasm = @('OpenCvSharp5.runtime.wasm.*.nupkg')
              manylinux = @(
                  'OpenCvSharp5.official.runtime.linux-x64.[0-9]*.nupkg'
                  'OpenCvSharp5.official.runtime.linux-x64.headless.*.nupkg'
                  'OpenCvSharp5.official.runtime.linux-x64.slim.*.nupkg'
                  'OpenCvSharp5.official.runtime.linux-arm64.[0-9]*.nupkg'
                  'OpenCvSharp5.official.runtime.linux-arm64.headless.*.nupkg'
                  'OpenCvSharp5.official.runtime.linux-arm64.slim.*.nupkg'
              )
              macos = @(
                  'OpenCvSharp5.runtime.osx.x64.*.nupkg'
                  'OpenCvSharp5.runtime.osx.arm64.*.nupkg'
              )
          }

          # Depth 3 includes files at depth 4 relative to the working directory.
          $packages = @(Get-ChildItem -LiteralPath . -Depth 3 -File -Force |
              Where-Object { $_.Name -clike '*.nupkg' })
          $skipPlatforms = $env:SKIP_PLATFORMS -split ','
          $failed = 0

          foreach ($platform in $requiredPackages.Keys) {
              if ($platform -ne 'windows' -and $skipPlatforms -ccontains $platform) {
                  Write-Output "skip_platforms: skipping $platform package checks"
                  continue
              }

              foreach ($pattern in $requiredPackages[$platform]) {
                  if ($packages.Name -clike $pattern) {
                      Write-Output "OK: $pattern"
                  } else {
                      Write-Output "MISSING: $pattern"
                      $failed++
                  }
              }
          }

          if ($failed -gt 0) {
              Write-Output ''
              Write-Output "ERROR: $failed package validation issue(s). Detected .nupkg files:"
              $packages.FullName
              exit 1
          }

      - name: Strip beta suffix from packages
        if: ${{ !inputs.keep_beta }}
        run: |
          $packages = Get-ChildItem -LiteralPath . -File |
              Where-Object { $_.Name -cmatch '-beta.*\.s?nupkg$' } |
              Sort-Object Extension, Name

          foreach ($package in $packages) {
              if ($package.Name -cnotmatch '^OpenCvSharp5\..*[0-9]{8}-beta[0-9]*\.s?nupkg$') {
                  Write-Output "ERROR: Unexpected -beta package file name: $($package.Name)"
                  exit 1
              }

              $archive = [System.IO.Compression.ZipFile]::Open($package.FullName, 'Update')
              try {
                  $nuspecs = @($archive.Entries | Where-Object { $_.FullName -clike '*.nuspec' })
                  if ($nuspecs.Count -gt 1) {
                      throw "Multiple .nuspec entries in $($package.Name)"
                  }
                  if ($nuspecs.Count -eq 1) {
                      $entry = $nuspecs[0]
                      $entryName = $entry.Name
                      # Use a byte-preserving encoding because the replacements only touch ASCII.
                      $encoding = [System.Text.Encoding]::Latin1
                      $reader = [System.IO.StreamReader]::new($entry.Open(), $encoding, $false)
                      try {
                          $nuspec = $reader.ReadToEnd()
                      } finally {
                          $reader.Dispose()
                      }

                      # Strip the package's own beta suffix and, except for ubuntu packages, dependency suffixes.
                      $nuspec = $nuspec -creplace '(?m)^([^\r\n]*?)-beta-?[0-9]*(</version>)', '$1$2'
                      if ($package.Name -cnotlike '*ubuntu*') {
                          $nuspec = $nuspec -creplace '(version="[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{8})-beta-?[0-9]*', '$1'
                      }

                      $entry.Delete()
                      $writer = [System.IO.StreamWriter]::new($archive.CreateEntry($entryName).Open(), $encoding)
                      try {
                          $writer.Write($nuspec)
                      } finally {
                          $writer.Dispose()
                      }
                  }
              } finally {
                  $archive.Dispose()
              }

              $newName = [regex]::new('-beta-?[0-9]*').Replace($package.Name, '', 1)
              Move-Item -LiteralPath $package.FullName -Destination (Join-Path $package.DirectoryName $newName) -Force
          }

      - name: Verify no beta versions remain
        if: ${{ !inputs.keep_beta }}
        run: |
          $betaFiles = Get-ChildItem -File -Force | Where-Object { $_.Name -clike '*-beta*' }
          if ($betaFiles) {
              Write-Output 'ERROR: beta packages still exist after rename'
              $betaFiles.FullName
              exit 1
          }

      - name: Determine package version
        id: version
        env:
          KEEP_BETA: ${{ inputs.keep_beta }}
        run: |
          $packages = @(Get-ChildItem -File -Filter '*.nupkg' |
              Where-Object { $_.Name -clike 'OpenCvSharp5.[0-9]*.nupkg' })
          if ($packages.Count -ne 1) {
              throw "Expected exactly one OpenCvSharp5 package, found $($packages.Count)"
          }
          $version = $packages[0].BaseName.Substring('OpenCvSharp5.'.Length)
          if ($env:KEEP_BETA -cne 'true' -and $version -cnotmatch '^5\.[0-9]+\.[0-9]+\.[0-9]{8}$') {
              throw "Unexpected stable OpenCvSharp5 version: $version"
          }
          Write-Output "Package version: $version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: List packages to publish
        run: |
          $packages = @(Get-ChildItem -File -Filter '*.nupkg')
          $symbols = @(Get-ChildItem -File -Filter '*.snupkg')
          $packages + $symbols | Select-Object Name, Length | Format-Table

          @('## NuGet Packages to Publish', '', '| Package | Size |', '|---------|------|') |
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          foreach ($package in $packages) {
              '| {0} | {1:N2} MiB |' -f $package.Name, ($package.Length / 1MB) |
                  Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }
          @('', "**Total:** $($packages.Count) nupkg, $($symbols.Count) snupkg") |
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Upload release packages
        uses: actions/upload-artifact@v7
        with:
          name: release-packages
          path: |
            *.nupkg
            *.snupkg
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Consume the actual, about-to-be-published .nupkg files as a real PackageReference
  # (against a local feed, not a ProjectReference against source) before anything gets
  # pushed to nuget.org. Catches packaging mistakes - wrong RID asset placement, a missing
  # native library, a broken dependency graph - that the source-level "test" jobs in
  # windows.yml/manylinux.yml/macos.yml never exercise, since those only ever run against
  # loose build output with the native binary copied in by hand.
  # ---------------------------------------------------------------------------
  PackageSmokeTest:
    name: Package smoke test (${{ matrix.os }})
    needs: Prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runtime_package: OpenCvSharp5.Windows
          - os: ubuntu-latest
            runtime_package: OpenCvSharp5.official.runtime.linux-x64
          - os: ubuntu-26.04-arm
            runtime_package: OpenCvSharp5.official.runtime.linux-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Download release packages
        uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: release-packages

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Run package smoke test
        env:
          SMOKE_TEST_VERSION: ${{ needs.Prepare.outputs.version }}
          SMOKE_TEST_RUNTIME_PACKAGE: ${{ matrix.runtime_package }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Set-Location test/OpenCvSharp.PackageSmokeTest
          $buildProperties = @(
              "-p:RestoreAdditionalProjectSources=$env:GITHUB_WORKSPACE/release-packages"
              "-p:SmokeTestPackageVersion=$env:SMOKE_TEST_VERSION"
              "-p:SmokeTestRuntimePackage=$env:SMOKE_TEST_RUNTIME_PACKAGE"
          )
          dotnet run -c Release @buildProperties

  Publish:
    needs: [Prepare, PackageSmokeTest]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-26.04
    environment: nuget-production
    permissions:
      contents: read
      id-token: write # OIDC token for NuGet trusted publishing

    steps:
      - name: Download release packages
        uses: actions/download-artifact@v8
        with:
          name: release-packages

      - name: List packages
        run: Get-ChildItem -File -Include *.nupkg, *.snupkg -Path ./* | Select-Object Name, Length | Format-Table

      # Exchange the GitHub OIDC token for a short-lived (1 hour) nuget.org API key.
      # Requires a trusted publishing policy on nuget.org for this repo, workflow
      # file (publish_nuget.yml) and environment (nuget-production).
      - name: NuGet login (OIDC -> temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          # Keep processing the remaining packages if one push fails.
          $PSNativeCommandUseErrorActionPreference = $false
          $counts = [ordered]@{ Pushed = 0; Skipped = 0; Failed = 0 }
          @('## Push Results', '| Package | Status |', '|---------|--------|') |
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

          # dotnet nuget push also uploads any matching .snupkg in the same directory.
          foreach ($package in (Get-ChildItem -File -Filter '*.nupkg' | Sort-Object Name)) {
              $pushOptions = @('--skip-duplicate', '--force-english-output', '-k', $env:NUGET_API_KEY)
              $output = dotnet nuget push $package.Name @pushOptions -s https://api.nuget.org/v3/index.json 2>&1
              $pushExitCode = $LASTEXITCODE
              $output | ForEach-Object { Write-Output $_.ToString() }

              $status = if ($pushExitCode -ne 0) { 'Failed' }
                  elseif ($output -match 'already exists') { 'Skipped' }
                  else { 'Pushed' }
              $counts[$status]++
              Write-Output ('{0}: {1}' -f $status, $package.Name)
              '| {0} | {1} |' -f $package.Name, $status | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }
          @('', "**Pushed:** $($counts.Pushed)  **Skipped:** $($counts.Skipped)  **Failed:** $($counts.Failed)") |
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

          if ($counts.Failed -gt 0) {
              throw "$($counts.Failed) package(s) failed to push."
          }
          # GitHub's pwsh wrapper propagates the last native command's exit code.
          exit 0

  Release:
    needs: [Prepare, Publish]
    if: ${{ !inputs.keep_beta }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    concurrency:
      group: github-release-${{ needs.Prepare.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.Prepare.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          # A missing tag or release is expected on the first run. Check native exit codes explicitly.
          $PSNativeCommandUseErrorActionPreference = $false

          $releaseVersion = $env:RELEASE_VERSION
          $sourceCommit = $env:GITHUB_SHA

          # --target only applies to a new tag. Check an existing tag before using it.
          $tagCommit = git rev-parse --verify --quiet "refs/tags/${releaseVersion}^{commit}"
          if ($LASTEXITCODE -eq 0) {
              if ($tagCommit -cne $sourceCommit) {
                  Write-Output "Tag $releaseVersion points to $tagCommit, expected $sourceCommit"
                  exit 1
              }
              $isDraft = gh release view $releaseVersion --json isDraft --jq .isDraft
              if ($LASTEXITCODE -eq 0) {
                  if ($isDraft -ceq 'false') {
                      Write-Output "GitHub Release $releaseVersion already exists"
                      exit 0
                  }
                  Write-Output "A draft already exists for $releaseVersion. Review and publish it on GitHub."
                  exit 1
              }
          }

          # Stay on this commit's history and use the highest older stable 5.x tag.
          $tags = git tag --merged $sourceCommit --sort=-version:refname --list '5.*'
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }
          $previousTag = $tags | Where-Object {
              $_ -cmatch '^5\.[0-9]+\.[0-9]+\.[0-9]{8}$' -and [version]$_ -lt [version]$releaseVersion
          } | Select-Object -First 1
          if (-not $previousTag) {
              Write-Output "No previous stable 5.x tag found in the history of $sourceCommit"
              exit 1
          }

          gh release create $releaseVersion --target $sourceCommit --generate-notes --notes-start-tag $previousTag
          exit $LASTEXITCODE
